name: Multiplayer

# CI for the co-op fork: builds the curses game and the test binary on Linux,
# then runs the multiplayer tests and the engine tests that touch the hooks.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: mp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build + [mp] tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      MAKE_OPTS: >-
        RELEASE=1 TILES=0 SOUND=0 LOCALIZE=0 BACKTRACE=0 LINTJSON=0
        ASTYLE=0 RUNTESTS=0 CCACHE=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libncursesw5-dev zlib1g-dev ccache python3

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-curses-release
          max-size: 2G

      - name: Build game and tests
        run: make -j"$(nproc)" $MAKE_OPTS cataclysm tests

      - name: Multiplayer tests
        run: ./tests/cata_test --rng-seed time '[mp]'

      - name: Engine tests around the hooks
        run: ./tests/cata_test --rng-seed time '[npc],[monster],[activity]'

      - name: Probe client syntax
        run: python3 -I -m py_compile tools/mp/mp_probe.py

  arch:
    name: Arch PKGBUILD (makepkg, tiles + curses)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git pkgconf ncurses zlib freetype2 \
            sdl3 sdl3_image sdl3_ttf sdl3_mixer python
          useradd -m builder
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: makepkg
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/pkg && cp packaging/arch/PKGBUILD /tmp/pkg/
          chown -R builder "$GITHUB_WORKSPACE" /tmp/pkg
          cd /tmp/pkg
          sudo -u builder env \
            CDDA_MP_SOURCE="git+file://$GITHUB_WORKSPACE#commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            MAKEFLAGS="-j$(nproc)" makepkg --noconfirm
      - name: Inspect package
        run: |
          pkg=$(ls /tmp/pkg/*.pkg.tar.zst | grep -v debug)
          tar -tf "$pkg" | grep -E 'usr/bin/|completions|site-functions|vendor_completions|licenses|doc/' | sort
          pacman -U --noconfirm "$pkg"
          cataclysm --help | head -n 3
          cataclysm-mp-probe --help | head -n 3

  windows:
    name: Windows native transport (MSVC)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            tools/mp

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build transport smoke test
        shell: cmd
        run: >
          cl /nologo /std:c++17 /EHsc /W4 /WX /DWIN32_LEAN_AND_MEAN /Isrc
          src\mp_framing.cpp src\mp_transport.cpp tools\mp\transport_smoke.cpp
          /Fe:transport_smoke.exe ws2_32.lib

      - name: Run transport smoke test
        shell: cmd
        run: transport_smoke.exe
